<title>평가이력카드</title>
<style>
/* Layout: one A4-like sheet (max 960px) read top-down: 개요 → 등급추이 → 권고↔이행 대비 → 반복지적 → 확인사항 */
:root{
  /* KOSI CI 디자인 시스템 토큰 (DESIGN.md): 청록 한 축, 난색은 경고 앰버·하이라이트 노랑뿐 */
  --paper:#f4f7f9; --sheet:#ffffff; --head:#f8fafc; --ink:#1f2a37; --ink-2:#63707e; --ink-3:#8a8d8f; --line:#e3e8ee; --line-2:#eef5f5;
  --teal:#00646e; --teal-deep:#004a52; --teal-soft:#e2f0f0; --green:#00a56e; --navy:#173a6d; --navy-soft:#e2f0f0;
  --bad:#b45309; --bad-soft:#fbeee2; --warn:#8a6100; --warn-soft:#fde68a; --ok:#1e7d3c; --ok-soft:#e8f7ee; --mid:#004a52; --mid-soft:#e2f0f0; --none:#b6bcc6;
  --row-hover:#f8fbff; --row-sel:#eef7f7; --dim-bg:#f6f7f9; --dim-ink:#b6bcc6;
  --r-sm:6px; --r-md:9px; --r-lg:12px; --r-xl:14px; --pill:999px;
  --display:"KoPubWorldDotum","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif; --body:"KoPubWorldDotum","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif; --mono:"KoPubWorldDotum","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:13px}
.toolbar label{display:flex;gap:8px;align-items:center;min-width:0;flex:1 1 320px;white-space:nowrap;font-weight:700;font-size:11.5px}
.toolbar select{flex:1 1 auto;min-width:0;max-width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--sheet);color:var(--ink)}
.toolbar select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.toolbar .proto{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r-xl);padding:28px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:600px){.sheet{padding:18px 16px}}
.head{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:end;border-bottom:2px solid var(--teal);padding-bottom:14px}
.eyebrow{font-size:11.5px;color:var(--teal);font-weight:700}
h1{font-family:var(--display);font-size:28px;line-height:1.15;margin:4px 0 0;font-weight:900;letter-spacing:-0.5px;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--ink-2);margin-top:4px}
.stamp{text-align:right;font-size:12px;color:var(--ink-2);line-height:1.5}
.stamp b{display:block;font-size:13px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
@media (max-width:600px){.head{grid-template-columns:1fr}.stamp{text-align:left}}
h2{font-size:16px;margin:0;font-weight:800;display:flex;align-items:baseline;gap:10px;color:var(--ink)}
h2 .n{font-size:12px;color:var(--teal);font-weight:800;font-variant-numeric:tabular-nums}
h2 .hint{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:auto}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
/* 개요 */
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.meta div{padding:8px 12px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0}
.meta div:nth-child(4n){border-right:0}
.meta dt{font-size:11.5px;color:var(--ink-2);font-weight:700}
.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.meta dd.mono{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.meta div:nth-child(2n){border-right:0}}
/* 등급 추이 */
.trend{overflow-x:auto}
.trend table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
.trend th,.trend td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line-2);font-size:13px}
.trend th{font-weight:700;color:var(--ink-2);font-size:11.5px;background:var(--head);font-variant-numeric:tabular-nums}
.trend th.row,.trend td.row{text-align:left;color:var(--ink-2);font-family:var(--body);font-weight:500;width:9.5em;white-space:nowrap}
.trend td.field{font-size:12px;color:var(--ink-3)}
.chip{display:inline-block;min-width:4.2em;padding:3px 10px;border-radius:var(--pill);font-size:12px;font-weight:700;line-height:1.4;border:1px solid transparent}
.g-bad{background:var(--bad-soft);color:var(--bad)}
.g-ok{background:var(--ok-soft);color:var(--ok)}
.g-mid{background:var(--mid-soft);color:var(--mid)}
.g-warn{background:var(--warn-soft);color:var(--ink)}
.g-none{color:var(--dim-ink);border:1px dashed var(--dim-ink);background:var(--dim-bg);font-weight:400}
.g-wait{color:var(--ink-3);border:1px dashed var(--line);background:transparent;font-weight:400}
.g-cut{background:var(--bad);color:#fff}
.banner{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);border-radius:var(--r-md);padding:8px 12px;font-size:12.5px;line-height:1.6}
.banner b{color:var(--ink);font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border-left:3px solid var(--teal);padding:4px 12px;min-width:0}
.kpi b{display:block;font-size:22px;font-weight:900;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi.alert{border-left-color:var(--bad)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{font-size:12px;color:var(--ink-3);line-height:1.6}
.note b{color:var(--ink-2);font-weight:500}
/* 권고 ↔ 이행 */
.pair{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pair .yr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--navy-soft);font-weight:700;font-size:13px}
.pair .yr .mono{font-weight:800;color:var(--teal);font-variant-numeric:tabular-nums}
.pair .yr .st{margin-left:auto;font-weight:500;font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols>div{padding:10px 12px;min-width:0}
.cols>div+div{border-left:1px solid var(--line-2)}
.cols .lab{font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.item+.item{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:8px}
.item .t{font-weight:700}
.item .k{color:var(--teal-deep);font-size:12px;font-weight:700;margin-right:4px}
.item p{margin:2px 0;font-size:13px;overflow-wrap:anywhere}
.item .sub{margin:2px 0 0 1em;font-size:12.5px;color:var(--ink-2)}
.item .sub::before{content:"- ";color:var(--ink-3)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--r-sm);font-weight:700;vertical-align:1px;margin-left:6px}
.b-done{background:var(--ok-soft);color:var(--ok)} .b-plan{background:var(--warn-soft);color:var(--warn)} .b-none{background:var(--bad-soft);color:var(--bad)} .b-rep{background:var(--bad);color:#fff} .b-smp{background:var(--warn-soft);color:var(--ink)} .b-na{background:var(--mid-soft);color:var(--mid)}
.empty{color:var(--ink-2);font-size:13px;border:1px dashed var(--line);border-radius:var(--r-md);padding:10px 12px;line-height:1.6;background:var(--dim-bg)}
.bt{overflow-x:auto;padding:6px 12px 0}
.bt table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.bt th,.bt td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:center;vertical-align:top}
.bt th{font-size:11.5px;font-weight:700;color:var(--ink-2);background:var(--head)}
.bt th.n,.bt td.n,.bt th.t,.bt td.t{text-align:left}
.bt td.c{white-space:nowrap;font-variant-numeric:tabular-nums}
.bt td.t{font-size:12px;color:var(--ink-2);min-width:16em}
.empty b{color:var(--ink-2);font-weight:500}
.cols.hdr>div{padding-bottom:2px}
.cols.prow{border-top:1px dashed var(--line-2)}
.cols.prow>div{padding-top:8px;padding-bottom:8px}
.cols.prow .item{margin:0;padding:0;border:0}
.no{display:inline-block;min-width:1.4em;font-size:11px;font-weight:700;color:var(--teal-deep);background:var(--teal-soft);border-radius:var(--r-sm);text-align:center;margin-right:6px;vertical-align:1px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.cols{grid-template-columns:1fr}.cols>div+div{border-left:0;border-top:1px solid var(--line-2)}.cols.prow>div+div{border-top:1px dotted var(--line-2)}}
/* 반복 지적 */
.rep{border:1px solid var(--bad);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bad-soft)}
.rep .r{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;font-size:13px}
.rep .r .y{color:var(--bad);font-size:12px;font-weight:700;padding-top:2px;font-variant-numeric:tabular-nums}
.rep .r p{margin:0;overflow-wrap:anywhere}
/* 확인사항 */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:grid;grid-template-columns:1.3em minmax(0,1fr);gap:8px;font-size:13.5px}
.check li::before{content:"□";color:var(--navy);font-size:15px;line-height:1.3}
.check .ex{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.check .ex::before{content:"○ ";color:var(--ink-3)}
footer{border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
footer b{color:var(--ink-2);font-weight:500}
a{color:var(--teal);font-weight:700;text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
</style>

function bigrams(s){ s=(s||'').replace(/[\s·,.()'’‘"“”\-]/g,''); const S=new Set(); for(let i=0;i<s.length-1;i++) S.add(s.slice(i,i+2)); return S; }

const KEYS = ['성과지표','집행률','집행','만족도','지원대상','수요','부정수급','환류','목표치','유사·중복','중복','사후관리','선별','선정기준'];

      <div><dt>저성과 판정</dt><dd class="mono">${lows.length}회${lastLow?` (최근 ${lastLow})`:''}</dd></div>
      <div><dt>비고</dt><dd>${esc(p.exclude||'해당 없음')}</dd></div>
    </dl>
  </section>

  <section>
    <h2><span class="n">2</span>등급 추이 ${Y0}~${Y1}<span class="hint">미흡(~’21)·개선필요(’22~)는 동일 저성과 등급</span></h2>
    <div class="trend"><table>
      <thead><tr><th class="row">평가연도</th>${YEARS.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td class="row">중소기업 지원사업 성과평가</td>${YEARS.map(y=>`<td>${chip(p.grade[y])}</td>`).join('')}</tr>
        <tr><td class="row field">평가 분야</td>${YEARS.map(y=>`<td class="field">${esc(p.field[y]||'·')}</td>`).join('')}</tr>
        ${fiscalRows(p)}
      </tbody></table></div>
    <div class="kpis">
      <div class="kpi ${lows.length?'alert':''}"><b>${lows.length}회</b><span>저성과 판정(미흡·개선필요)</span></div>
      <div class="kpi ${cons.length?'alert':''}"><b>${cons.length?cons.join(', '):'없음'}</b><span>연속 저성과</span></div>
      <div class="kpi"><b>${realF.length}/${lows.filter(y=>hwpYears.includes(y)).length}</b><span>수합본 수록 저성과 연도 중 지적 원문 확보</span></div>
      <div class="kpi ${lows.some(y=>hwpYears.includes(y)) && !realA.length ? 'alert':''}"><b>${realA.length}건</b><span>이행조치 회신 연도</span></div>
    </div>
    <p class="note">${fiscalNote(p)}</p>
  </section>

  <section>
    <h2><span class="n">3</span>전년도 권고 ↔ 금년도 이행실적 대비<span class="hint">중소기업 지원사업 성과평가 · 저성과 연도별 · 좌: 평가보고서 원문, 우: 부처 회신</span></h2>
    ${hasSample?`<div class="banner"><b>예시 데이터 안내.</b> ${esc(p.sample_note||'아래 지적·권고·이행조치 중 예시 표식 항목은 서식 시연용 가상 문안으로, 실제 평가보고서 원문과 부처 회신으로 교체해야 함.')}</div>`:''}
    ${pairs}
  </section>

  <section>
    <h2><span class="n">4</span>타 재정사업평가 종합의견·권고<span class="hint">열린재정 미공개 평가보고서 원문 · 본 평가 지적과의 교차 여부는 5절</span></h2>
    ${otherHtml}
  </section>

  <section>
    <h2><span class="n">5</span>반복 지적·미개선 사항<span class="hint">본 평가 연도 간 반복 · 타 제도 권고와의 교차</span></h2>
    ${repHtml}
  </section>`;
}

// ---- 사업 선택
const sel = document.getElementById('pick');
const sorted = [...D.programs].sort((a,b)=> (a.ministry===b.ministry ? a.name.localeCompare(b.name,'ko') : a.ministry.localeCompare(b.ministry,'ko')));
for(const p of sorted){
  const o = document.createElement('option'); o.value = p.id;
  const tag = Object.keys(p.findings).length ? (Object.values(p.findings).flat().some(f=>f.sample) ? ' ○' : ' ●') : '';
  o.textContent = `${p.ministry} · ${p.name}${tag}`; sel.appendChild(o);
}
const SAMPLE = D.programs.some(x=>x.id==='3612300') ? '3612300' : D.programs[0].id; // 기본: 중소벤처기업부 마케팅지원사업
if(D.single){ document.querySelector('.toolbar label').style.display='none'; document.getElementById('idx').style.display='none'; }   // 단일 사업 카드(--only)
function pickFromHash(){ const m=/^#p(\d+)$/.exec(location.hash); return m && D.programs.some(p=>p.id===m[1]) ? m[1] : null; }
function show(id){ const p = D.programs.find(x=>x.id===id) || D.programs.find(x=>x.id===SAMPLE); sel.value=p.id; render(p); try{ history.replaceState(null,'','#p'+p.id);}catch(e){} }
sel.addEventListener('change', e=>show(e.target.value));
show(pickFromHash() || SAMPLE);
</script>
