<title>평가이력카드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one A4-like sheet (max 960px) read top-down: 개요 → 등급추이 → 권고↔이행 대비 → 반복지적 → 확인사항 */
:root{
  --paper:#f5f6f8; --sheet:#ffffff; --ink:#1b2330; --ink-2:#4a5566; --ink-3:#7b8596; --line:#d9dee6; --line-2:#eef1f5;
  --navy:#24456e; --navy-soft:#e8eef7;
  --bad:#b23a3a; --bad-soft:#fbe9e9; --warn:#a86a12; --warn-soft:#fcf1dd; --ok:#2f7a4f; --ok-soft:#e5f3ea; --mid:#5c6b82; --mid-soft:#eceff4; --none:#c3c9d3;
  --display:"Noto Serif KR",serif; --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161d; --sheet:#1a2029; --ink:#e7ebf1; --ink-2:#b5bdca; --ink-3:#8590a1; --line:#2f3845; --line-2:#242c37;
  --navy:#8fb0dc; --navy-soft:#213247;
  --bad:#e07a7a; --bad-soft:#3a2224; --warn:#e0b060; --warn-soft:#3a2f1c; --ok:#7fc49a; --ok-soft:#1f3328; --mid:#aab4c4; --mid-soft:#2a3240; --none:#4a5463; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12161d; --sheet:#1a2029; --ink:#e7ebf1; --ink-2:#b5bdca; --ink-3:#8590a1; --line:#2f3845; --line-2:#242c37;
  --navy:#8fb0dc; --navy-soft:#213247;
  --bad:#e07a7a; --bad-soft:#3a2224; --warn:#e0b060; --warn-soft:#3a2f1c; --ok:#7fc49a; --ok-soft:#1f3328; --mid:#aab4c4; --mid-soft:#2a3240; --none:#4a5463; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;margin:0;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:13px}
.toolbar label{display:flex;gap:8px;align-items:center;min-width:0;flex:1 1 320px}
.toolbar select{flex:1 1 auto;min-width:0;max-width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.toolbar .proto{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-3)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:28px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:600px){.sheet{padding:18px 16px}}
.head{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:end;border-bottom:2px solid var(--navy);padding-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:500}
h1{font-family:var(--display);font-size:26px;line-height:1.25;margin:4px 0 0;font-weight:700;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:400;color:var(--ink-2);margin-top:4px}
.stamp{text-align:right;font-size:12px;color:var(--ink-2);line-height:1.5}
.stamp b{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}
@media (max-width:600px){.head{grid-template-columns:1fr}.stamp{text-align:left}}
h2{font-size:15px;margin:0;font-weight:700;display:flex;align-items:baseline;gap:10px;color:var(--ink)}
h2 .n{font-family:var(--mono);font-size:12px;color:var(--navy);font-weight:500}
h2 .hint{font-size:12px;font-weight:400;color:var(--ink-3);margin-left:auto}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
/* 개요 */
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.meta div{padding:8px 12px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0}
.meta div:nth-child(4n){border-right:0}
.meta dt{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.meta dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.meta dd.mono{font-family:var(--mono);font-weight:400;font-size:13px}
@media (max-width:640px){.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.meta div:nth-child(2n){border-right:0}}
/* 등급 추이 */
.trend{overflow-x:auto}
.trend table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
.trend th,.trend td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line-2);font-size:13px}
.trend th{font-weight:500;color:var(--ink-2);font-family:var(--mono);font-size:12px}
.trend th.row,.trend td.row{text-align:left;color:var(--ink-2);font-family:var(--body);font-weight:500;width:9.5em;white-space:nowrap}
.trend td.field{font-size:12px;color:var(--ink-3)}
.chip{display:inline-block;min-width:4.2em;padding:3px 8px;border-radius:3px;font-size:12px;font-weight:500;line-height:1.4;border:1px solid transparent}
.g-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.g-ok{background:var(--ok-soft);color:var(--ok)}
.g-mid{background:var(--mid-soft);color:var(--mid)}
.g-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.g-none{color:var(--none);border:1px dashed var(--none);background:transparent}
.g-wait{color:var(--ink-3);border:1px dashed var(--line);background:transparent;font-weight:400}
.g-cut{background:var(--bad);color:#fff}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:4px;padding:8px 12px;font-size:12.5px;line-height:1.6}
.banner b{color:var(--warn);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border-left:3px solid var(--navy);padding:4px 12px;min-width:0}
.kpi b{display:block;font-size:20px;font-family:var(--display);line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi.alert{border-left-color:var(--bad)}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.note{font-size:12px;color:var(--ink-3);line-height:1.6}
.note b{color:var(--ink-2);font-weight:500}
/* 권고 ↔ 이행 */
.pair{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pair .yr{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--navy-soft);font-weight:700;font-size:13px}
.pair .yr .mono{font-family:var(--mono);font-weight:500;color:var(--navy)}
.pair .yr .st{margin-left:auto;font-weight:500;font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.cols>div{padding:10px 12px;min-width:0}
.cols>div+div{border-left:1px solid var(--line-2)}
.cols .lab{font-size:11px;letter-spacing:.05em;color:var(--ink-3);margin-bottom:4px}
.item+.item{border-top:1px dashed var(--line-2);margin-top:8px;padding-top:8px}
.item .t{font-weight:700}
.item .k{color:var(--ink-3);font-size:12px;margin-right:4px}
.item p{margin:2px 0;font-size:13px;overflow-wrap:anywhere}
.item .sub{margin:2px 0 0 1em;font-size:12.5px;color:var(--ink-2)}
.item .sub::before{content:"- ";color:var(--ink-3)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;font-weight:500;vertical-align:1px;margin-left:6px}
.b-done{background:var(--ok-soft);color:var(--ok)} .b-plan{background:var(--warn-soft);color:var(--warn)} .b-none{background:var(--bad-soft);color:var(--bad)} .b-rep{background:var(--bad);color:#fff} .b-smp{background:var(--warn);color:#fff} .b-na{background:var(--mid-soft);color:var(--mid)}
.empty{color:var(--ink-3);font-size:13px;border:1px dashed var(--line);border-radius:4px;padding:10px 12px;line-height:1.6}
.bt{overflow-x:auto;padding:6px 12px 0}
.bt table{border-collapse:collapse;width:100%;min-width:640px;font-size:12.5px}
.bt th,.bt td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:center;vertical-align:top}
.bt th{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.bt th.n,.bt td.n,.bt th.t,.bt td.t{text-align:left}
.bt td.c{font-family:var(--mono);white-space:nowrap}
.bt td.t{font-size:12px;color:var(--ink-2);min-width:16em}
.empty b{color:var(--ink-2);font-weight:500}
.cols.hdr>div{padding-bottom:2px}
.cols.prow{border-top:1px dashed var(--line-2)}
.cols.prow>div{padding-top:8px;padding-bottom:8px}
.cols.prow .item{margin:0;padding:0;border:0}
.no{display:inline-block;min-width:1.4em;font-family:var(--mono);font-size:11px;color:var(--navy);border:1px solid var(--navy-soft);background:var(--navy-soft);border-radius:3px;text-align:center;margin-right:6px;vertical-align:1px}
@media (max-width:640px){.cols{grid-template-columns:1fr}.cols>div+div{border-left:0;border-top:1px solid var(--line-2)}.cols.prow>div+div{border-top:1px dotted var(--line-2)}}
/* 반복 지적 */
.rep{border:1px solid var(--bad);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rep .r{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 10px;font-size:13px}
.rep .r .y{font-family:var(--mono);color:var(--bad);font-size:12px;padding-top:2px}
.rep .r p{margin:0;overflow-wrap:anywhere}
/* 확인사항 */
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:grid;grid-template-columns:1.3em minmax(0,1fr);gap:8px;font-size:13.5px}
.check li::before{content:"□";color:var(--navy);font-size:15px;line-height:1.3}
.check .ex{display:block;color:var(--ink-2);font-size:12.5px;margin-top:2px}
.check .ex::before{content:"○ ";color:var(--ink-3)}
footer{border-top:1px solid var(--line);padding-top:10px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
footer b{color:var(--ink-2);font-weight:500}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
</style>

<div class="wrap">
  <div class="toolbar">
    <label>표시 사업 <select id="pick" aria-label="사업 선택"></select></label>
    <a id="idx" href="index.html">전체 사업 목록</a>
    <span class="proto">PROTOTYPE · 2026-10-25 · 계속평가 사업 평가이력제(안) · ● 원문 수합 ○ 예시 문안</span>
  </div>

  <article class="sheet" id="card"></article>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const YEARS = D.years;                       // 표시 연도(build_card.py --from, 기본 2020~)
const Y0 = YEARS[0], Y1 = YEARS[YEARS.length-1];
const NOW = {y:2026, m:10};
const LOW = new Set(['미흡','개선필요','감액']);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gradeClass = g => !g ? 'g-none' : g==='감액' ? 'g-cut' : LOW.has(g) ? 'g-bad' : g==='우수' ? 'g-ok' : 'g-mid';
const chip = g => `<span class="chip ${gradeClass(g)}">${g ? esc(g) : '미평가'}</span>`;

// 완료일 문자열 "’24.2월" → {y,m}
function parseDone(s){ s=s||''; let m = /(\d{2})\.\s*(\d{1,2})월?/.exec(s); if(m) return {y:2000+ +m[1], m:+m[2]};
  m = /[’‘'`]?(\d{2})\s*~/.exec(s); return m ? {y:2000+ +m[1], m:1} : null; }                 // (’24.2월) (~‘26.12) (‘25~)
function doneBadge(s){
  const d = parseDone(s);
  if(!d) return '<span class="badge b-na">완료일 미기재</span>';
  const future = d.y > NOW.y || (d.y===NOW.y && d.m > NOW.m);
  return `<span class="badge ${future?'b-plan':'b-done'}">${future?'이행 예정':'이행 완료'} ${esc(s)}</span>`;
}
// 문자 2-gram 유사도(교집합/작은 집합)
function bigrams(s){ s=(s||'').replace(/[\s·,.()'’‘"“”\-]/g,''); const S=new Set(); for(let i=0;i<s.length-1;i++) S.add(s.slice(i,i+2)); return S; }
function sim(a,b){ const A=bigrams(a),B=bigrams(b); if(!A.size||!B.size) return 0; let n=0; A.forEach(x=>{ if(B.has(x)) n++; }); return n/Math.min(A.size,B.size); }
const KEYS = ['성과지표','집행률','집행','만족도','지원대상','수요','부정수급','환류','목표치','유사·중복','중복','사후관리','선별','선정기준'];
function keyOf(t){ return KEYS.find(k => (t||'').includes(k)); }
// 연도 간 반복 지적 탐지
function repeats(p){
  const ys = Object.keys(p.findings).sort(); const out=[];
  for(let i=0;i<ys.length;i++) for(let j=i+1;j<ys.length;j++){
    for(const a of p.findings[ys[i]]) for(const b of p.findings[ys[j]]){
      const s = sim(a.title+' '+a.issue, b.title+' '+b.issue);
      const ka = keyOf(a.title), kb = keyOf(b.title);
      if(s>=0.28 || (ka && ka===kb)) out.push({y1:ys[i],y2:ys[j],a,b,key:ka||kb||'', s});
    }
  }
  return out;
}
// 열린재정 재정사업평가결과 표기 → 색상
const FIS_BAD = new Set(['미흡','개선','개선필요','감액','폐지']), FIS_WARN = new Set(['사업개선']), FIS_OK = new Set(['우수','양호','정상추진']);
const fisClass = r => FIS_BAD.has(r) ? 'g-bad' : FIS_WARN.has(r) ? 'g-warn' : FIS_OK.has(r) ? 'g-ok' : 'g-mid';
const fisChip = recs => !recs || !recs.length ? '<span class="chip g-none">미수록</span>'
  : recs.map(r=>`<span class="chip ${fisClass(r.result)}" title="${esc(r.system)} · ${esc(r.src_name)}${r.type&&r.type!=='-'?' · '+esc(r.type):''}">${esc(r.result)}</span>`).join(' ');
// 열린재정 '개선' 표기는 '개선필요'에 해당
const sameGrade = (g, r) => { const m = {'개선':'개선필요'}; return (g||'').trim() === (m[r]||r); };
function fiscalRows(p){
  // 타 재정사업평가제도: 본 평가(중소기업지원사업평가)는 제외
  const systems = []; YEARS.forEach(y => (p.fiscal[y]||[]).forEach(r => { if(r.system!=='중소기업지원사업평가' && !systems.includes(r.system)) systems.push(r.system); }));
  if(!systems.length) return `<tr><td class="row">타 재정사업평가제도<br><span class="note">열린재정 미수록</span></td>${YEARS.map(()=>'<td><span class="chip g-none">미수록</span></td>').join('')}</tr>`;
  return systems.map((sy,i) => `<tr><td class="row">${i===0?'타 재정사업평가제도':''}<br><span class="note">${esc(sy)}</span></td>${YEARS.map(y => `<td>${fisChip((p.fiscal[y]||[]).filter(r=>r.system===sy))}</td>`).join('')}</tr>`).join('');
}
function fiscalCheck(p){
  const out = {same:[], diff:[]};
  YEARS.forEach(y => { const g = p.grade[y]; const recs = (p.fiscal[y]||[]).filter(r=>r.system==='중소기업지원사업평가'); if(!g || !recs.length) return;
    (recs.some(r=>sameGrade(g,r.result)) ? out.same : out.diff).push({y, g, f: recs.map(r=>r.result).join('/')}); });
  return out;
}
function fiscalNote(p){
  const c = fiscalCheck(p), fy = YEARS.filter(y=>(p.fiscal[y]||[]).length);
  if(!fy.length) return `타 재정사업평가제도 행은 열린재정 재정사업평가결과(’19~’26, ${D.fiscal_rows}행) 기준이며, 동일 세부사업명을 찾지 못함. 사업명 변경·통폐합 여부 확인 필요.`;
  const ty = [...new Set(YEARS.flatMap(y=>(p.fiscal[y]||[]).filter(r=>r.system==='통합재정사업평가').map(r=>r.type)).filter(t=>t&&t!=='-'))];
  const jb = YEARS.flatMap(y=>(p.fiscal[y]||[]).filter(r=>r.account==='평가보고서').map(r=>`${y} ${r.system} ${r.result}`));
  let s = `타 재정사업평가제도 행은 열린재정 재정사업평가결과(수록 ${fy[0]}~${fy[fy.length-1]}년) 중 본 평가(중소기업지원사업평가)를 제외한 제도별 결과`;
  if(c.same.length+c.diff.length) s += ` · 열린재정 수록 중소기업지원사업평가 결과와 본 등급 ${c.same.length+c.diff.length}개 연도 대조 → 일치 ${c.same.length}건`;
  s += c.diff.length ? `, <b>불일치 ${c.diff.length}건(${c.diff.map(d=>`${d.y}: 본 등급 ${d.g} / 열린재정 ${d.f}`).join('; ')})</b>` : '';
  if(ty.length) s += ` · 2026년 통합재정사업평가 유형: ${ty.join(', ')}`;
  if(jb.length) s += ` · 평가보고서에서 추출(열린재정 미공개): ${jb.join(', ')}`;
  return s + '. 열린재정의 ‘개선’은 ‘개선필요’ 표기이며, 한 연도에 복수 표기는 사업명 변경 전후 또는 중복 수록분.';
}
function lowYears(p){ return YEARS.filter(y => LOW.has(p.grade[y])); }
function consecutive(p){ const r=[]; for(let i=1;i<YEARS.length;i++){ if(LOW.has(p.grade[YEARS[i]]) && LOW.has(p.grade[YEARS[i-1]])) r.push(`${YEARS[i-1]}→${YEARS[i]}`);} return r; }

function render(p){
  const lows = lowYears(p); const evalYears = YEARS.filter(y=>p.grade[y]);
  const lastLow = lows.length ? lows[lows.length-1] : null;
  const cons = consecutive(p);
  const reps = repeats(p);
  const fieldNow = [...YEARS].reverse().map(y=>p.field[y]).find(Boolean) || '-';
  const fieldHist = [...new Set(YEARS.map(y=>p.field[y]).filter(Boolean))];
  const mn = m => (m||'').replace(/\s*\(.*?\)\s*/g,'').trim();
  const hwpYears = ((D.coverage||{})[mn(p.ministry)]) || (D.coverage||{}).default || ['2023','2024','2025'];
  const covTxt = `’${hwpYears[0].slice(2)}~’${hwpYears[hwpYears.length-1].slice(2)}`;

  const realF = Object.keys(p.findings).filter(y=>!p.findings[y].some(f=>f.sample));
  const realA = Object.keys(p.actions).filter(y=>!p.actions[y].some(a=>a.sample));
  const hasSample = Object.values(p.findings).flat().some(f=>f.sample);

  // ---- 권고 ↔ 이행 블록(저성과 연도별)
  let pairs = '';
  for(const y of lows){
    const F = p.findings[y] || [], A = p.actions[y] || [];
    const hasF = F.length>0, hasA = A.length>0;
    const isSample = F.some(f=>f.sample) || A.some(a=>a.sample);
    let st, stCls;

  <footer><b>자료</b> ① (’19~’26년) 개선필요사업 등급추이(노란음영수정) xlsx → 1·2절 등급·분야·미흡횟수 ② (2026.10.12) 저성과 사업 개선사항 파악_부처별정리_261023수합본 hwp → 3·5절 지적·권고(1. 사업별 미흡판정 사유 및 개선권고) 및 이행조치·완료일(2. 개선권고별 이행조치 내용과 완료일). ③ 열린재정 재정사업평가결과(openfiscaldata.go.kr, ${esc(D.fiscal_meta?D.fiscal_meta.fetched_at:'')} 수집, ’19~’26 ${D.fiscal_rows}행) → 2절 타 재정사업평가제도 행(중소기업지원사업평가 제외), 세부사업명·소관 기준 결합, 6절 정합성 확인. ④ 중소벤처기업부 회신(’23~’26 성과평가 개선필요·미흡 판정 사업의 판정 이후 조치 내역, ’26.9.28) → 중기부 사업 3·5절 및 ’27 예산안 내역사업 조치. ⑤ 재정지원 일자리사업 평가보고서(${esc(D.jobs_meta?D.jobs_meta.year:'')}년, 사업별 HWP ${esc(D.jobs_meta?D.jobs_meta.count:'')}건) → 열린재정 미공개분의 일자리사업평가 등급(2절)과 종합의견·권고(4절), 5절 교차 지적. <b>표기</b> 연도는 평가 실시 연도(전년 실적 평가). 반복 지적은 연도 간 지적 제목·내용의 문자 2-gram 유사도 0.28 이상 또는 공통 핵심어로 자동 탐지한 후보이며 평가위원 확인을 전제로 함. <b>예시</b> '예시' 표식 항목은 수합본에 원문이 없는 사업의 서식 시연용 가상 문안으로 실제 평가보고서·부처 회신으로 교체 대상.</footer>`;

// ---- 사업 선택
const sel = document.getElementById('pick');
const sorted = [...D.programs].sort((a,b)=> (a.ministry===b.ministry ? a.name.localeCompare(b.name,'ko') : a.ministry.localeCompare(b.ministry,'ko')));
for(const p of sorted){
  const o = document.createElement('option'); o.value = p.id;
  const tag = Object.keys(p.findings).length ? (Object.values(p.findings).flat().some(f=>f.sample) ? ' ○' : ' ●') : '';
  o.textContent = `${p.ministry} · ${p.name}${tag}`; sel.appendChild(o);
}
const SAMPLE = D.programs.some(x=>x.id==='3612300') ? '3612300' : D.programs[0].id; // 기본: 중소벤처기업부 마케팅지원사업
if(D.single){ document.querySelector('.toolbar label').style.display='none'; document.getElementById('idx').style.display='none'; }   // 단일 사업 카드(--only)
function pickFromHash(){ const m=/^#p(\d+)$/.exec(location.hash); return m && D.programs.some(p=>p.id===m[1]) ? m[1] : null; }
function show(id){ const p = D.programs.find(x=>x.id===id) || D.programs.find(x=>x.id===SAMPLE); sel.value=p.id; render(p); try{ history.replaceState(null,'','#p'+p.id);}catch(e){} }
sel.addEventListener('change', e=>show(e.target.value));
show(pickFromHash() || SAMPLE);
</script>
